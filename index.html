<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Mesa de Post-its</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Estilos dos Fundos da Mesa */
    #board {
      width: 100vw;
      height: 100vh;
      position: relative;
      background-size: cover;
      background-position: center;
      transition: background 0.3s ease;
    }

    .bg-wood {
      background: #8b5a2b;
      background-image: radial-gradient(rgba(0,0,0,0.15) 15%, transparent 16%), radial-gradient(rgba(0,0,0,0.15) 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
    }

    .bg-cork {
      background-color: #d2a679;
      background-image: repeating-radial-gradient(circle at 0 0, transparent 0, #c49463 10px), repeating-linear-gradient(#be8a5755, #be8a57);
    }

    .bg-dark {
      background-color: #22252a;
    }

    .bg-slate {
      background-color: #1e3a2b;
    }

    /* Barra de Ferramentas Superior */
    #toolbar {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 99999;
    }

    .btn {
      background: #ffffff;
      border: 1px solid #ccc;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #f0f0f0;
      transform: translateY(-1px);
    }

    .btn-add {
      background: #ffd54f;
      border-color: #fbc02d;
    }

    .btn-add:hover {
      background: #ffca28;
    }

    select {
      padding: 6px 12px;
      border-radius: 15px;
      border: 1px solid #ccc;
      outline: none;
      cursor: pointer;
    }

    /* Estilo do Post-it */
    .postit {
      position: absolute;
      width: 220px;
      height: 220px;
      padding: 15px;
      box-shadow: 5px 5px 15px rgba(0,0,0,0.25);
      cursor: grab;
      display: flex;
      flex-direction: column;
      border-bottom-right-radius: 30px 5px;
      transition: box-shadow 0.2s;
    }

    .postit:active {
      cursor: grabbing;
      box-shadow: 10px 15px 25px rgba(0,0,0,0.3);
    }

    /* Cores dos Post-its */
    .yellow { background: #fffa75; }
    .pink   { background: #ff7eb9; }
    .green  { background: #7afcff; }
    .orange { background: #ff9e9e; }
    .purple { background: #dcd6f7; }

    /* Barra de Controle do Post-it */
    .postit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      cursor: move;
    }

    .postit-tools {
      display: flex;
      gap: 5px;
    }

    .tool-btn {
      background: rgba(0, 0, 0, 0.08);
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-btn:hover {
      background: rgba(0, 0, 0, 0.2);
    }

    .tool-btn.active {
      background: #333;
      color: #fff;
    }

    /* Área de Texto Digitável */
    .postit-text {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      resize: none;
      outline: none;
      font-family: 'Comic Sans MS', 'Caveat', cursive, sans-serif;
      font-size: 18px;
      color: #222;
      line-height: 1.3;
      user-select: text;
    }

    /* Canvas para Rabiscar/Desenhar por cima */
    .postit-canvas {
      position: absolute;
      top: 40px;
      left: 0;
      width: 100%;
      height: calc(100% - 40px);
      pointer-events: none;
      z-index: 2;
    }

    .mode-draw .postit-canvas {
      pointer-events: auto;
      cursor: crosshair;
    }

    .mode-draw .postit-text {
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Barra de Controle Global -->
  <div id="toolbar">
    <button class="btn btn-add" onclick="createPostit()">➕ Novo Post-it</button>
    
    <label for="colorSelect">Cor:</label>
    <select id="colorSelect">
      <option value="yellow">Amarelo</option>
      <option value="pink">Rosa</option>
      <option value="green">Verde Água</option>
      <option value="orange">Laranja</option>
      <option value="purple">Roxo</option>
    </select>

    <label for="bgSelect">Fundo da Mesa:</label>
    <select id="bgSelect" onchange="changeBackground(this.value)">
      <option value="bg-wood">Mesa de Madeira</option>
      <option value="bg-cork">Mural de Cortiça</option>
      <option value="bg-slate">Quadro Escuro</option>
      <option value="bg-dark">Cinza Minimalista</option>
    </select>
  </div>

  <!-- A Mesa onde tudo acontece -->
  <div id="board" class="bg-wood"></div>

  <script>
    const board = document.getElementById('board');
    let topZIndex = 100;

    // Função para alterar o fundo da mesa
    function changeBackground(bgClass) {
      board.className = bgClass;
    }

    // Função para criar um novo Post-it
    function createPostit(text = "", posX = null, posY = null) {
      topZIndex++;
      
      const postit = document.createElement('div');
      const color = document.getElementById('colorSelect').value;
      
      // Posição inicial (ou centralizada ou onde for passada)
      const x = posX !== null ? posX : Math.random() * (window.innerWidth - 300) + 50;
      const y = posY !== null ? posY : Math.random() * (window.innerHeight - 300) + 80;
      const rotation = (Math.random() * 12) - 6; // Pequena rotação realista

      postit.className = `postit ${color}`;
      postit.style.left = `${x}px`;
      postit.style.top = `${y}px`;
      postit.style.transform = `rotate(${rotation}deg)`;
      postit.style.zIndex = topZIndex;

      // Estrutura interna do Post-it
      postit.innerHTML = `
        <div class="postit-header">
          <div class="postit-tools">
            <button class="tool-btn btn-text active" title="Modo Texto (Digitar)" onclick="setMode(this, 'text')">✏️</button>
            <button class="tool-btn btn-draw" title="Modo Caneta (Desenhar à mão)" onclick="setMode(this, 'draw')">🖌️</button>
            <button class="tool-btn" title="Limpar Desenho" onclick="clearCanvas(this)">🧹</button>
          </div>
          <button class="tool-btn" title="Excluir" onclick="postit.remove()">❌</button>
        </div>
        <textarea class="postit-text" placeholder="Escreva algo...">${text}</textarea>
        <canvas class="postit-canvas"></canvas>
      `;

      board.appendChild(postit);

      // Configurar Canvas de Desenho
      const canvas = postit.querySelector('.postit-canvas');
      const ctx = canvas.getContext('2d');
      
      // Ajusta resolução do canvas para o tamanho real do elemento
      canvas.width = 220;
      canvas.height = 180;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#1a1a1a'; // Cor da caneta

      let isDrawing = false;

      // Eventos para Desenhar à Mão Livre
      canvas.addEventListener('mousedown', (e) => {
        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);
      });

      canvas.addEventListener('mousemove', (e) => {
        if (isDrawing) {
          ctx.lineTo(e.offsetX, e.offsetY);
          ctx.stroke();
        }
      });

      canvas.addEventListener('mouseup', () => isDrawing = false);
      canvas.addEventListener('mouseleave', () => isDrawing = false);

      // Lógica de Arrastar e Soltar (Drag and Drop)
      makeDraggable(postit);
    }

    // Alternar entre modo Digitação e modo Caneta
    function setMode(btn, mode) {
      const postit = btn.closest('.postit');
      const buttons = postit.querySelectorAll('.postit-tools .tool-btn');
      
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (mode === 'draw') {
        postit.classList.add('mode-draw');
      } else {
        postit.classList.remove('mode-draw');
      }
    }

    // Limpar o desenho do Canvas
    function clearCanvas(btn) {
      const postit = btn.closest('.postit');
      const canvas = postit.querySelector('.postit-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Tornar o elemento arrastável pela tela toda
    function makeDraggable(element) {
      let offsetX = 0, offsetY = 0, isDragging = false;

      element.addEventListener('mousedown', (e) => {
        // Se clicar nos botões ou na área de texto no modo texto, não arrasta
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON' || element.classList.contains('mode-draw')) {
          // Traz para a frente mesmo clicando para editar
          topZIndex++;
          element.style.zIndex = topZIndex;
          return;
        }

        isDragging = true;
        topZIndex++;
        element.style.zIndex = topZIndex; // Traz para cima de todos

        offsetX = e.clientX - element.offsetLeft;
        offsetY = e.clientY - element.offsetTop;
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        element.style.left = `${e.clientX - offsetX}px`;
        element.style.top = `${e.clientY - offsetY}px`;
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }

    // Criar 3 post-its de exemplo ao abrir a página
    window.onload = () => {
      createPostit("Comprar pó de café", 100, 150);
      createPostit("Reunião às 15h 🚀", 360, 200);
      createPostit("Ideia para o site!", 620, 120);
    };
  </script>
</body>
</html>
